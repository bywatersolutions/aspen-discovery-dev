name: Static Analysis

on:
  pull_request:

jobs:
  check-allowlist:
    name: Check User Allowlist
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Checkout allowlist from base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          sparse-checkout: |
            .github/ci_users.txt
          sparse-checkout-cone-mode: false

      - name: Verify PR author
        id: check
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          ALLOWLIST=".github/ci_users.txt"

          if [ -f "$ALLOWLIST" ] && grep -Fxiq "$AUTHOR" "$ALLOWLIST"; then
            echo "Author '$AUTHOR' is allowed."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Author '$AUTHOR' is not in the allowlist."
            echo "If you want to be included, add your username to $ALLOWLIST."
            
            {
              echo "### ℹ️ Static Analysis Skipped"
              echo "Static analysis was skipped because **@$AUTHOR** is not on the opt-in list."
              echo ""
              echo "If you want to run PHPStan and PHPMD automatically on your PRs, open a PR adding your GitHub username to \`$ALLOWLIST\`."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  phpstan:
    name: Run PHPStan
    needs: check-allowlist
    if: needs.check-allowlist.outputs.allowed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, phpstan
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Restore result cache
        uses: actions/cache/restore@v4
        with:
          path: tmp
          key: "phpstan-result-cache-${{ github.run_id }}"
          restore-keys: |
            phpstan-result-cache-

      - name: Run PHPStan
        run: phpstan analyse --memory-limit=1G -vv

      - name: Save result cache
        uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: tmp
          key: "phpstan-result-cache-${{ github.run_id }}"

  phpmd:
    name: Run PHPMD
    needs: check-allowlist
    if: needs.check-allowlist.outputs.allowed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, phpmd
          coverage: none

      - name: Run PHPMD
        run: |
          phpmd analyze \
          --format xml \
          --ruleset phpmd.xml \
          --exclude vendor \
          --exclude tmp \
          --baseline-file phpmd.baseline.xml \
          .
# Increase process and file limits for the aspen and solr users. These apply
# to interactive/cron use; the systemd units carry their own LimitNOFILE and
# LimitNPROC settings.
aspen         soft    nproc           65000
aspen         soft    nofile          65000
aspen         hard    nproc           65000
aspen         hard    nofile          65000
solr          soft    nproc           65000
solr          soft    nofile          65000
solr          hard    nproc           65000
solr          hard    nofile          65000
